<form id="task-form" class="task-form" novalidate>
    <div class="form-group">
        <label for="task-name">Nombre de la tarea *</label>
        <input 
            type="text" 
            id="task-name" 
            name="nombre" 
            placeholder="Ej. Rediseñar vista de inicio" 
            autocomplete="off"
        />
        <span class="error-message" id="error-task-name"></span>
    </div>

    <div class="form-group">
        <label for="task-description">Descripción *</label>
        <textarea 
            id="task-description" 
            name="descripcion" 
            rows="3" 
            placeholder="Detalles sobre lo que se debe realizar en la tarea..."
        ></textarea>
        <span class="error-message" id="error-task-description"></span>
    </div>

    <div class="form-group">
        <label for="task-assignee">Asignado a *</label>
        <input 
            type="text" 
            id="task-assignee" 
            name="asignadoA" 
            placeholder="Ej. Julian Lozano" 
            autocomplete="off"
        />
        <span class="error-message" id="error-task-assignee"></span>
    </div>

    <div class="form-group">
        <label for="task-due-date">Fecha de Entrega *</label>
        <input 
            type="date" 
            id="task-due-date" 
            name="fechaDeEntrega" 
        />
        <span class="error-message" id="error-task-due-date"></span>
    </div>

    <div class="form-group">
        <label for="task-status">Estado *</label>
        <select id="task-status" name="estado">
            <option value="" disabled selected>Selecciona un estado</option>
            <option value="POR HACER">POR HACER</option>
            <option value="EN PROCESO">EN PROCESO</option>
            <option value="REVISIÓN">REVISIÓN</option>
            <option value="HECHO">HECHO</option>
        </select>
        <span class="error-message" id="error-task-status"></span>
    </div>

    <div class="form-actions">
        <button type="submit" id="btn-submit-task" class="btn btn-primary">Agregar Tarea</button>
        <button type="reset" id="btn-reset-task" class="btn btn-secondary">Limpiar</button>
    </div>
</form>
