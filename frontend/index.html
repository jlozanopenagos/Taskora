<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskora - Planificador de Tareas</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/task-form.css">
    <link rel="stylesheet" href="css/components/task-card.css">
    <link rel="stylesheet" href="css/components/footer.css">
</head>

<body>
    <header class="app-header">
        <div class="header-container">
            <h1 class="app-title">Taskora</h1>
            <p class="app-tagline">Planificador y Gestor de Tareas</p>
        </div>
    </header>

    <main class="app-main">
        <div class="layout-container">
            <section class="form-section" aria-labelledby="form-heading">
                <h2 id="form-heading" class="section-title">Nueva Tarea</h2>
                <p class="section-description">Completa los campos para planificar tu actividad.</p>
                
                <form id="task-form" class="task-form" novalidate>
                    <div class="form-group">
                        <label for="task-name">Nombre de la tarea *</label>
                        <input 
                            type="text" 
                            id="task-name" 
                            name="nombre" 
                            placeholder="Ej. Rediseñar vista de inicio" 
                            autocomplete="off"
                        />
                        <span class="error-message" id="error-task-name"></span>
                    </div>

                    <div class="form-group">
                        <label for="task-description">Descripción *</label>
                        <textarea 
                            id="task-description" 
                            name="descripcion" 
                            rows="3" 
                            placeholder="Detalles sobre lo que se debe realizar en la tarea..."
                        ></textarea>
                        <span class="error-message" id="error-task-description"></span>
                    </div>

                    <div class="form-group">
                        <label for="task-assignee">Asignado a *</label>
                        <input 
                            type="text" 
                            id="task-assignee" 
                            name="asignadoA" 
                            placeholder="Ej. Julian Lozano" 
                            autocomplete="off"
                        />
                        <span class="error-message" id="error-task-assignee"></span>
                    </div>

                    <div class="form-group">
                        <label for="task-due-date">Fecha de Entrega *</label>
                        <input 
                            type="date" 
                            id="task-due-date" 
                            name="fechaDeEntrega" 
                        />
                        <span class="error-message" id="error-task-due-date"></span>
                    </div>

                    <div class="form-group">
                        <label for="task-status">Estado *</label>
                        <select id="task-status" name="estado">
                            <option value="" disabled selected>Selecciona un estado</option>
                            <option value="POR HACER">POR HACER</option>
                            <option value="EN PROCESO">EN PROCESO</option>
                            <option value="REVISIÓN">REVISIÓN</option>
                            <option value="HECHO">HECHO</option>
                        </select>
                        <span class="error-message" id="error-task-status"></span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="btn-submit-task" class="btn btn-primary">Agregar Tarea</button>
                        <button type="reset" id="btn-reset-task" class="btn btn-secondary">Limpiar</button>
                    </div>
                </form>
            </section>

            <section class="tasks-section" aria-labelledby="tasks-heading">
                <div class="tasks-header">
                    <h2 id="tasks-heading" class="section-title">Tareas Planificadas</h2>
                    <span id="tasks-count" class="tasks-count-badge">0 tareas</span>
                </div>

                <div id="empty-state" class="empty-state">
                    <p>No tienes tareas creadas aún. Llena el formulario para agregar una.</p>
                </div>

                <div id="tasks-container" class="tasks-grid"></div>
            </section>
        </div>
    </main>

    <footer class="app-footer">
        <p>Taskora &copy; 2026 - Gestión y planificación de tareas personales</p>
    </footer>

    <script src="js/TaskManager.js"></script>
    <script src="js/components/task-form.js"></script>
    <script src="js/components/task-card.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
